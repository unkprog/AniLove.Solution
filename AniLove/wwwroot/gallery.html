<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniLove - Галерея собак</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <header class="app-bar">
        <div class="app-bar-content">
            <div class="app-bar-logo">
                <span class="material-symbols-outlined">pets</span>
                <span>AniLove</span>
            </div>
            <div class="nav-tabs">
                <a href="/index.html" class="nav-tab">Главная</a>
                <a href="/scheme.html" class="nav-tab">Схема</a>
                <a href="/gallery.html" class="nav-tab active">Галерея</a>
                <a href="/admin.html" class="nav-tab">Админка</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="section-header">
                <h2>Галерея собак</h2>
                <p class="section-subtitle">Каждая собака ждёт своего человека</p>
                <div class="gallery-filters" id="galleryFilters">
                    <button class="filter-chip active" data-filter="all">Все</button>
                    <button class="filter-chip" data-filter="active">В приюте</button>
                    <button class="filter-chip" data-filter="adopted">Нашли дом</button>
                    <button class="filter-chip" data-filter="male">Мальчики</button>
                    <button class="filter-chip" data-filter="female">Девочки</button>
                    <button class="filter-chip" data-filter="young">До 2 лет</button>
                    <button class="filter-chip" data-filter="adult">От 2 лет</button>
                </div>
            </div>
            <div id="galleryGrid" class="gallery-grid"></div>
        </section>
    </main>

    <!-- Модальное окно карточки собаки -->
    <div id="animalModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modalTitle">Карточка собаки</h3>
            <div id="animalModalContent"></div>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="historyTitle">История</h3>
            <div id="historyContent"></div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/gallery.js"></script>
    <script>
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const navTabs = document.querySelector('.nav-tabs');
        mobileBtn.addEventListener('click', () => navTabs.classList.toggle('active'));
    </script>
</body>
</html>
